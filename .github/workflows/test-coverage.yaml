# Test coverage collection + one Codecov upload.
# Derived from https://github.com/r-lib/actions/tree/v2/examples
# (test-coverage.yaml) with these prepR4pcm-specific choices:
#   * OIDC auth (`use_oidc: true`); no CODECOV_TOKEN and no GH_TOKEN-as-token.
#   * Job-scoped permissions: contents:read + id-token:write only.
#   * Ubuntu-only. Do not add covr to R-CMD-check.yaml: that workflow's
#     default shard is already ubuntu, and os=full would double-count.
#   * Existing testthat suite unchanged (skip_on_cran / skip_if_not_installed
#     / skip_if_offline / live-backend smokes preserved).
# Config (this file + codecov.yml) does not prove coverage ran, uploaded,
# or was accepted. See docs/dev-log/test-coverage.md.
#
# SHA notes (do not conflate):
#   * On pull_request, actions/checkout@v6 checks out github.sha, which is
#     GitHub's synthetic merge of the PR branch into the base. The PR head
#     commit is github.event.pull_request.head.sha.
#   * codecov-action reports against the PR head for pull_request events.
#   * On push to main, checkout SHA == branch HEAD == Codecov commit.
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

name: test-coverage

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/master' }}

permissions: {}

jobs:
  test-coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@v6

      - name: Record checkout vs PR-head SHAs
        run: |
          echo "github.event_name=${{ github.event_name }}"
          echo "github.ref=${{ github.ref }}"
          echo "github.sha (checkout / GITHUB_SHA)=${{ github.sha }}"
          echo "github.event.pull_request.head.sha=${{ github.event.pull_request.head.sha }}"
          echo "github.event.pull_request.base.sha=${{ github.event.pull_request.base.sha }}"

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::covr, any::xml2
          # Same field set as R-CMD-check.yaml so coverage measures the
          # same Suggests-installed suite. Do not pull Enhances.
          dependencies: 'c("Imports", "Depends", "LinkingTo", "Suggests")'
          needs: coverage

      - name: Test coverage
        run: |
          install_path <- file.path(
            normalizePath(Sys.getenv("RUNNER_TEMP"), winslash = "/"),
            "package"
          )
          ws <- Sys.getenv("GITHUB_WORKSPACE")
          if (!nzchar(ws)) ws <- normalizePath(getwd())
          src_yml <- file.path(ws, "_pkgdown.yml")
          if (!file.exists(src_yml)) {
            stop("checkout source-layout missing: ", src_yml)
          }

          # Claim tests call .claim_root(), which returns the first tree
          # with DESCRIPTION+R/. Under covr that is the instrumented
          # install library, not the Actions checkout. _pkgdown.yml is
          # correctly Rbuildignored for CRAN, so INSTALL omits it and
          # those tests error instead of skipping. Overlay the checkout
          # file onto the install tree immediately before
          # tools::testInstalledPackage() runs the existing suite.
          # Assertions and skip() calls are unchanged.
          tracer <- bquote({
            src <- .(src_yml)
            lib <- if (is.null(lib.loc) || !length(lib.loc)) {
              .libPaths()[[1L]]
            } else {
              lib.loc[[1L]]
            }
            dest_dir <- file.path(lib, pkg)
            dest <- file.path(dest_dir, "_pkgdown.yml")
            if (!dir.exists(dest_dir)) {
              stop("covr install tree missing, cannot overlay _pkgdown.yml: ",
                   dest_dir)
            }
            ok <- file.copy(src, dest, overwrite = TRUE)
            if (!isTRUE(ok) || !file.exists(dest)) {
              stop("failed to overlay checkout _pkgdown.yml onto ", dest)
            }
            cat(sprintf("PREPR4PCM_OVERLAY_PKGDOWN=%s\n", dest))
            cat(sprintf("PREPR4PCM_CHECKOUT_PKGDOWN=%s\n", src))
          })
          suppressMessages(trace(
            "testInstalledPackage",
            where = asNamespace("tools"),
            tracer = tracer,
            at = 1L,
            print = FALSE
          ))
          on.exit(suppressMessages(untrace(
            "testInstalledPackage",
            where = asNamespace("tools")
          )), add = TRUE)

          cov <- covr::package_coverage(
            quiet = FALSE,
            clean = FALSE,
            install_path = install_path
          )
          print(cov)
          pct <- round(covr::percent_coverage(cov), 2)
          summary_file <- Sys.getenv("GITHUB_STEP_SUMMARY")
          if (nzchar(summary_file)) {
            writeLines(
              c(
                "## covr (CI coverage finish, not Codecov acceptance)",
                "",
                paste0("- package coverage: ", pct, "%"),
                "- suite: existing testthat (skips unchanged)",
                "- checkout _pkgdown.yml overlaid onto covr install tree",
                "- this print is CI coverage finish, not upload or dashboard evidence",
                paste0("- GITHUB_SHA (checkout): ", Sys.getenv("GITHUB_SHA"))
              ),
              summary_file
            )
          }
          cat(sprintf("PREPR4PCM_COVR_PERCENT=%s\n", pct))
          covr::to_cobertura(cov)
        shell: Rscript {0}

      - name: Upload coverage to Codecov (OIDC)
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7
        with:
          fail_ci_if_error: true
          files: ./cobertura.xml
          plugins: noop
          disable_search: true
          use_oidc: true
          name: prepr4pcm-ubuntu-covr
          flags: ubuntu-covr
          verbose: true

      - name: Show testthat output
        if: always()
        run: |
          find '${{ runner.temp }}/package' -name 'testthat.Rout*' -exec cat '{}' \; || true
        shell: bash

      - name: Upload coverage-test failures
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: coverage-test-failures
          path: ${{ runner.temp }}/package
